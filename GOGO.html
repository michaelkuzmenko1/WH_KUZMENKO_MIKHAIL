<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>

<style>
    * {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background-color: rgb(0, 0, 0);
}

.grid {
    width: 100%;
    min-height: 100vh;

    display: grid;

    grid-template-columns: 1fr 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr 1fr;

    gap: 12px;
}

.block {
    border-radius: 14px;
    background: #ffffff;
}

.block1 {
    grid-column: 1;
    grid-row: 1 / 3;
}

.block2 {
    grid-column: 2;
    grid-row: 1;
}

.block3 {
    grid-column: 3;
    grid-row: 1;
}

.block4 {
    grid-column: 1;
    grid-row: 3;
}

.block5 {
    grid-column: 2 / 4;
    grid-row: 2 / 4;
}

.block6 {
    grid-column: 4;
    grid-row: 1 / 3;
}

.block7 {
    grid-column: 4;
    grid-row: 3;
}

.block8 {
    grid-column: 1 / 3;
    grid-row: 4;
}

.block9 {
    grid-column: 3 / 5;
    grid-row: 4;
}
</style>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="grid">
        <section class="block block1"></section>
        <section class="block block2"></section>
        <section class="block block3"></section>
        <section class="block block4"></section>
        <section class="block block5"></section>
        <section class="block block6"></section>
        <section class="block block7"></section>
        <section class="block block8"></section>
        <section class="block block9"></section>
    </main>
</body>
</html>

</html>
